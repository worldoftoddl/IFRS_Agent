<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">IFRS Agent UI Operation Map</title>
  <desc id="desc">Chatbot UI to LangGraph agent, retrieval subagents, context memory, and transcript archive flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .panel-title { font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .ui { fill: #eff6ff; stroke: #60a5fa; }
      .agent { fill: #f5f3ff; stroke: #a78bfa; }
      .tool { fill: #ecfdf5; stroke: #34d399; }
      .store { fill: #fff7ed; stroke: #fb923c; }
      .warn { fill: #fef2f2; stroke: #f87171; }
      .muted { fill: #f1f5f9; stroke: #cbd5e1; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.6; marker-end: url(#arrow-green); }
      .arrow-dash { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .note { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1260"/>
  <text x="60" y="64" class="panel-title" style="font-size:34px">IFRS_Agent UI 작동 Map</text>
  <text x="60" y="94" class="small">프론트엔드 모드 선택부터 LangGraph 라우팅, 검색, context memory, transcript archive까지의 현재 구조</text>

  <!-- Frontend panel -->
  <rect x="50" y="130" width="500" height="770" class="panel"/>
  <text x="80" y="175" class="panel-title">1. Chatbot UI</text>

  <rect x="90" y="210" width="190" height="74" class="box ui"/>
  <text x="115" y="240" class="label">사용자 입력</text>
  <text x="115" y="263" class="small">ChatInput</text>

  <rect x="330" y="210" width="170" height="74" class="box ui"/>
  <text x="365" y="240" class="label">모드 선택</text>
  <text x="360" y="263" class="small">K-IFRS / 감사 / 자동</text>

  <rect x="90" y="340" width="190" height="88" class="box store"/>
  <text x="112" y="370" class="label">localStorage</text>
  <text x="112" y="394" class="small">kifrs-domain-mode</text>

  <rect x="330" y="340" width="170" height="88" class="box store"/>
  <text x="353" y="370" class="label">sessionStorage</text>
  <text x="354" y="394" class="tiny">thread-id:{mode}</text>
  <text x="354" y="414" class="tiny">모드별 thread 분리</text>

  <rect x="90" y="490" width="410" height="98" class="box ui"/>
  <text x="116" y="522" class="label">useChat.sendMessage</text>
  <text x="116" y="548" class="small">화면에는 원문만 optimistic 표시</text>
  <text x="116" y="570" class="small">서버 전송 메시지에는 숨은 라우팅 힌트 추가</text>

  <rect x="90" y="650" width="410" height="106" class="box ui"/>
  <text x="116" y="682" class="label">submitted message</text>
  <text x="116" y="710" class="small">[UI_MODE: IFRS | AUDIT | AUTO]</text>
  <text x="116" y="734" class="small">사용자 질문: ...</text>

  <rect x="90" y="810" width="410" height="58" class="box ui"/>
  <text x="116" y="846" class="label">useStream.submit → LangGraph API</text>

  <line x1="280" y1="247" x2="330" y2="247" class="arrow"/>
  <line x1="415" y1="284" x2="415" y2="340" class="arrow"/>
  <line x1="185" y1="284" x2="185" y2="340" class="arrow"/>
  <line x1="295" y1="428" x2="295" y2="490" class="arrow"/>
  <line x1="295" y1="588" x2="295" y2="650" class="arrow"/>
  <line x1="295" y1="756" x2="295" y2="810" class="arrow-blue"/>

  <!-- Backend panel -->
  <rect x="650" y="130" width="500" height="770" class="panel"/>
  <text x="680" y="175" class="panel-title">2. LangGraph Agent</text>

  <rect x="705" y="210" width="390" height="86" class="box agent"/>
  <text x="735" y="242" class="label">System Prompt</text>
  <text x="735" y="268" class="small">UI_MODE를 내부 라우팅 정보로 사용</text>

  <rect x="705" y="350" width="390" height="96" class="box agent"/>
  <text x="735" y="382" class="label">후속 질문 판단</text>
  <text x="735" y="408" class="small">"방금", "그 문단", "위 기준" 등</text>
  <text x="735" y="430" class="small">먼저 context_search 후보</text>

  <rect x="705" y="500" width="178" height="86" class="box tool"/>
  <text x="728" y="532" class="label">context_search</text>
  <text x="728" y="558" class="small">이전 검색 재사용</text>

  <rect x="917" y="500" width="178" height="86" class="box agent"/>
  <text x="947" y="532" class="label">새 검색</text>
  <text x="947" y="558" class="small">memory 부족/새 주제</text>

  <rect x="705" y="655" width="178" height="96" class="box agent"/>
  <text x="735" y="687" class="label">K-IFRS</text>
  <text x="735" y="713" class="small">retrieval-distiller</text>
  <text x="735" y="735" class="small">task 도구</text>

  <rect x="917" y="655" width="178" height="96" class="box agent"/>
  <text x="947" y="687" class="label">감사기준</text>
  <text x="947" y="713" class="small">audit-retrieval</text>
  <text x="947" y="735" class="small">distiller task</text>

  <rect x="705" y="810" width="390" height="58" class="box agent"/>
  <text x="735" y="846" class="label">최종 답변 생성 → UI stream</text>

  <line x1="900" y1="296" x2="900" y2="350" class="arrow"/>
  <line x1="850" y1="446" x2="794" y2="500" class="arrow-green"/>
  <line x1="950" y1="446" x2="1006" y2="500" class="arrow"/>
  <line x1="1006" y1="586" x2="794" y2="655" class="arrow"/>
  <line x1="1006" y1="586" x2="1006" y2="655" class="arrow"/>
  <line x1="794" y1="586" x2="794" y2="810" class="arrow-green"/>
  <line x1="794" y1="751" x2="820" y2="810" class="arrow"/>
  <line x1="1006" y1="751" x2="980" y2="810" class="arrow"/>

  <!-- Retrieval panel -->
  <rect x="1250" y="130" width="500" height="770" class="panel"/>
  <text x="1280" y="175" class="panel-title">3. Retrieval Pipeline</text>

  <rect x="1300" y="220" width="400" height="82" class="box tool"/>
  <text x="1330" y="252" class="label">서브에이전트 검색 도구</text>
  <text x="1330" y="278" class="small">retrieve_* / lookup_* / search_single_*</text>

  <rect x="1300" y="365" width="190" height="100" class="box tool"/>
  <text x="1330" y="398" class="label">Dense Search</text>
  <text x="1330" y="424" class="small">summary + passage</text>
  <text x="1330" y="446" class="small">PostgreSQL / pgvector</text>

  <rect x="1510" y="365" width="190" height="100" class="box tool"/>
  <text x="1540" y="398" class="label">Reranker</text>
  <text x="1540" y="424" class="small">Cohere</text>
  <text x="1540" y="446" class="small">상위 근거 정렬</text>

  <rect x="1300" y="535" width="400" height="104" class="box tool"/>
  <text x="1330" y="570" class="label">서브에이전트 반환 JSON</text>
  <text x="1330" y="598" class="small">synthesis</text>
  <text x="1450" y="598" class="small">chunks</text>
  <text x="1540" y="598" class="small">notes</text>

  <rect x="1300" y="710" width="400" height="90" class="box store"/>
  <text x="1330" y="744" class="label">ContextMemoryMiddleware</text>
  <text x="1330" y="770" class="small">검색 결과를 즉시 .context에 저장</text>

  <line x1="1500" y1="302" x2="1395" y2="365" class="arrow"/>
  <line x1="1490" y1="415" x2="1510" y2="415" class="arrow-green"/>
  <line x1="1605" y1="465" x2="1500" y2="535" class="arrow-green"/>
  <line x1="1500" y1="639" x2="1500" y2="710" class="arrow-green"/>

  <!-- Cross-panel arrows -->
  <line x1="500" y1="839" x2="705" y2="253" class="arrow-blue"/>
  <text x="558" y="520" class="note" transform="rotate(-62 558 520)">LangGraph API</text>

  <line x1="1095" y1="703" x2="1300" y2="261" class="arrow-blue"/>
  <text x="1166" y="470" class="note" transform="rotate(-65 1166 470)">task → subagent</text>

  <line x1="1300" y1="587" x2="1095" y2="839" class="arrow-green"/>
  <text x="1158" y="735" class="note" transform="rotate(-51 1158 735)">JSON 근거 반환</text>

  <!-- Context management panel -->
  <rect x="50" y="960" width="1700" height="230" class="panel"/>
  <text x="80" y="1005" class="panel-title">4. Context Management</text>

  <rect x="90" y="1040" width="280" height="94" class="box store"/>
  <text x="118" y="1074" class="label">.context/{thread_id}.json</text>
  <text x="118" y="1100" class="small">후속 질문 재사용용 구조화 memory</text>
  <text x="118" y="1122" class="tiny">thread별 최대 20개</text>

  <rect x="445" y="1040" width="300" height="94" class="box muted"/>
  <text x="475" y="1074" class="label">LangGraph messages</text>
  <text x="475" y="1100" class="small">도구 결과가 대화 state에 누적</text>
  <text x="475" y="1122" class="tiny">초반에는 그대로 유지</text>

  <rect x="820" y="1040" width="300" height="94" class="box warn"/>
  <text x="850" y="1074" class="label">50K 추정 토큰 초과</text>
  <text x="850" y="1100" class="small">MicroCompactMiddleware 작동</text>
  <text x="850" y="1122" class="tiny">최근 ToolMessage 3개 보존</text>

  <rect x="1195" y="1040" width="240" height="94" class="box tool"/>
  <text x="1225" y="1074" class="label">Citation Digest</text>
  <text x="1225" y="1100" class="small">기준서/문단/발췌만 유지</text>

  <rect x="1500" y="1040" width="205" height="94" class="box store"/>
  <text x="1530" y="1074" class="label">.transcripts</text>
  <text x="1530" y="1100" class="small">디버그 archive</text>
  <text x="1530" y="1122" class="tiny">7일 또는 10MB cleanup</text>

  <line x1="370" y1="1087" x2="445" y2="1087" class="arrow-green"/>
  <line x1="745" y1="1087" x2="820" y2="1087" class="arrow"/>
  <line x1="1120" y1="1087" x2="1195" y2="1087" class="arrow"/>
  <line x1="1120" y1="1110" x2="1500" y2="1110" class="arrow-dash"/>

  <line x1="1500" y1="800" x2="230" y2="1040" class="arrow-green"/>
  <text x="832" y="918" class="note" transform="rotate(-10 832 918)">검색 결과 즉시 저장</text>

  <text x="80" y="1170" class="tiny">주의: UI에는 숨은 [UI_MODE] 힌트가 보이지 않으며, MessageList는 사용자 원문만 표시한다.</text>
  <text x="620" y="1170" class="tiny">후속 질문은 context_search를 먼저 쓰도록 프롬프트가 지시한다.</text>
  <text x="1130" y="1170" class="tiny">새 주제이거나 memory 관련성이 낮으면 기존 retrieval-distiller 경로로 새 검색한다.</text>
</svg>
